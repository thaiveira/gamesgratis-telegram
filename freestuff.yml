name: FreeStuff Telegram
on:
  schedule:
    - cron: "0 * * * *"   
  workflow_dispatch:       
permissions:
  contents: write      
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Rodar o bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
      - name: Salvar o que já foi enviado
        run: |
          git config user.name "freestuff-bot"
          git config user.email "freestuff-bot@users.noreply.github.com"
          git add sent.json
          git diff --staged --quiet || (git commit -m "atualiza sent.json" && git push)
